server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location ^~ /api/admin/ { return 404; }
    location = /api/recognition/online { client_max_body_size 3m; proxy_read_timeout 20s; proxy_pass http://backend:8000; }
    location /api/ { proxy_pass http://backend:8000; }
    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /手机指南-H5风格版.html { try_files $uri =404; }
    location ^~ /images/ { try_files $uri =404; }
    location / { return 404; }
}
server {
    listen 81;
    server_name _;
    location = / { root /usr/share/nginx/html/local-app; try_files /admin.html =404; }
    location /api/admin/ { proxy_pass http://backend:8000; }
    location / { return 404; }
}
