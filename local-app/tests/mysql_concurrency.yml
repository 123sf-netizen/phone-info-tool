services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: disposable-test-root
      MYSQL_DATABASE: phoneguide_test
      MYSQL_USER: disposable
      MYSQL_PASSWORD: disposable-test-password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [isolated]
  verify:
    image: chaxun-backend:latest
    environment:
      PYTHONPATH: /app
      DATABASE_URL: mysql+pymysql://disposable:disposable-test-password@mysql:3306/phoneguide_test?charset=utf8mb4
    volumes:
      - ./mysql_concurrency.py:/tmp/concurrency-test.py:ro
    command: ["python", "/tmp/concurrency-test.py"]
    depends_on:
      mysql:
        condition: service_healthy
    networks: [isolated]
networks:
  isolated:
    internal: true
