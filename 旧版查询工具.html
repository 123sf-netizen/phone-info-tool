st=phones.filter(p=>(p.name+p.brand).toLowerCase().includes(q)&&(!budget||(p.price!=null&&p.price<=budget)));if(use)list.sort((a,b)=>Number(b.tags.includes(use))-Number(a.tags.includes(use)));document.querySelector('#results').innerHTML=cards(list)+(use&&list.length?'<p class="muted">用途标签尚未建立，当前不提供可靠的用途排序；请查看参数自行判断。</p>':'')}function render(){if(page==='home')content.innerHTML=`<div class="hero"><span class="badge">FIND YOUR PHONE</span><h1>找到适合你的那部手机。</h1><p>查参数、看差异、按需求选机，一站完成。</p><div class="search"><input id="homeq" placeholder="搜索品牌或型号，例如 vivo X200"><button class="primary" onclick="let q=document.querySelector('#homeq').value;nav('search');document.querySelector('#query').value=q;filter()">搜索手机　→</button></div></div><section class="theme-showcase" aria-label="精选机型轮播"><div class="showcase-track" tabindex="0" aria-label="左右滑动浏览精选机型">${window.showcaseItems.map((item,i)=>{const p=phones.find(x=>x.id===item.id);return `<article class="showcase-slide" aria-label="第 ${i+1} 张，共 ${window.showcaseItems.length} 张"><h2>${p.name}</h2><p>${item.subtitle}</p><button class="showcase-link" onclick="detail(${item.id})">查看机型</button><img class="showcase-img" src="${phoneImages[item.id]}" alt="${p.name} 产品图" draggable="false" onerror="this.style.display='none'"></article>`}).join('')}</div><div class="showcase-dots" aria-label="选择展示机型">${window.showcaseItems.map((item,i)=>`<button type="button" data-showcase-dot="${i}" class="${i===0?'active':''}" aria-label="显示第 ${i+1} 款机型" aria-current="${i===0?'true':'false'}"></button>`).join('')}</div></section><div class="section"><div class="section-head"><div><h2>按品牌浏览</h2><span class="muted">选择品牌，查看旗下已收录的手机</span></div></div><div class="brands"><button class="brand-card" onclick="openBrand('华为')"><span class="brand-symbol"><img src="https://cdn.simpleicons.org/huawei/CF0A2C" alt="huawei 商标" loading="lazy"></span><span><strong>华为</strong><small>HUAWEI</small></span></button><button class="brand-card" onclick="openBrand('OPPO')"><span class="brand-symbol"><img src="https://cdn.simpleicons.org/oppo/087F54" alt="oppo 商标" loading="lazy"></span><span><strong>OPPO</strong><small>含一加</small></span></button><button class="brand-card" onclick="openBrand('vivo')"><span class="brand-symbol"><img src="https://cdn.simpleicons.org/vivo/415FFF" alt="vivo 商标" loading="lazy"></span><span><strong>vivo</strong><small>含 iQOO</small></span></button><button class="brand-card" onclick="openBrand('小米')"><span class="brand-symbol"><img src="https://cdn.simpleicons.org/xiaomi/FF6900" alt="xiaomi 商标" loading="lazy"></span><span><strong>小米</strong><small>含 REDMI</small></span></button></div></div><div class="section"><div class="section-head"><div><h2>从这里开始</h2><span class="muted">根据你的需求，选择一种方式</span></div></div><div class="grid"><div class="card" onclick="nav('search')"><div class="icon">⌕</div><h3>查手机</h3><p>搜索具体型号，查看详细参数和参考价格。</p><span class="arrow">开始查询 →</span></div><div class="card" onclick="nav('recommend')"><div class="icon">✦</div><h3>选手机</h3><p>告诉我们预算和使用偏好，发现合适的选择。</p><span class="arrow">开始选机 →</span></div><div class="card" onclick="nav('compare')"><div class="icon">▥</div><h3>机型对比</h3><p>将感兴趣的手机放在一起，轻松看清差异。</p><span class="arrow">查看对比 →</span></div></div></div><div class="section"><div class="section-head"><div><h2>探索真实机型</h2><span class="muted">已收录 295 款机型；产品目录持续补充</span></div></div><div class="panel">${cards(phones.slice(0,7))}</div></div>`;else if(page==='search'||page==='recommend'){let rec=page==='recommend';content.innerHTML=`<div class="section-head"><div><h2>${rec?'找到适合你的手机':'搜索手机，了解每一个细节'}</h2><span class="muted">${rec?'预算为必须满足的条件，使用场景作为排序偏好':'搜索型号，或通过条件缩小范围'}</span></div></div><div class="panel"><div class="filters"><input id="query" placeholder="品牌或型号" oninput="filter()"><select id="budget" onchange="filter()"><option value="">不限预算</option><option value="2500">¥2500 以内</option><option value="3000">¥3000 以内</option><option value="4000">¥4000 以内</option></select><select id="use" onchange="filter()"><option value="">不限使用场景</option><option>拍照</option><option>游戏</option><option>续航</option><option>轻薄</option></select></div><p class="muted">价格为历史或收录时参考价，并非实时价格；价格未知的机型不参与预算筛选。</p><div id="results">${cards(phones)}</div></div>`}else if(page==='compare'){let list=phones.filter(p=>selected.includes(p.id));content.innerHTML=`<div class="section-head"><div><h2>机型对比</h2><span class="muted">最多选择三款手机，横向查看关键参数</span></div><button class="smallbtn" onclick="nav('search')">+ 添加机型</button></div><div class="panel">${list.length?`<div style="overflow:auto"><table style="width:100%;min-width:500px;text-align:left;border-collapse:collapse"><tr><th>参数</th>${list.map(p=>`<th>${p.name}<br><button class="smallbtn" onclick="toggle(${p.id})">移除</button></th>`).join('')}</tr>${[['参考价格',p=>p.price?'¥'+p.price+' 起':'待查询'],['处理器',p=>p.chip],['屏幕',p=>p.screen],['电池 / 充电',p=>p.battery],['影像',p=>p.camera],['重量 / 防护',p=>p.weight+' / '+p.ip],['适合',p=>p.desc],['不足',p=>p.weak]].map(([label,fn])=>`<tr><td style="padding:16px 0;border-bottom:1px solid #eee;color:#89949b">${label}</td>${list.map(p=>`<td style="padding:16px 0;border-bottom:1px solid #eee">${fn(p)}</td>`).join('')}</tr>`).join('')}</table></div>`:'<div class="empty">还没有选择机型。前往查手机，点击“+ 对比”添加。</div>'}</div>`}else content.innerHTML=`<h2>数据说明</h2><div class="panel detail"><div class="notice">当前收录部分真实机型及官方公开信息，数据为静态整理，并非实时更新；价格与库存请以官方渠道为准。</div><h3>正式版本的数据规范</h3><p>每个型号按销售地区、存储版本分别记录，展示来源链接、采集时间和更新时间。价格需标明渠道及查询时间。</p><p>缺失参数显示“暂无数据”；来源冲突时标记“待核实”。定期更新新机、价格和下架状态。</p><h3>建议覆盖的字段</h3><p>基础信息、性能、屏幕、续航与充电、摄像头、机身材质、防尘防水、系统更新、网络连接、音频、维修与售后。</p><h3>信息纠错</h3><p>正式版本可提供参数纠错入口，记录机型、字段、建议内容及依据；本原型暂未连接后台。</p></div>`}render();
</script></body></html>
