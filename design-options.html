v>⌕　查手机</div><div>✦　选手机</div><div>▥　机型对比</div><div>▤　数据说明</div></div><div class="screen"><header><b>首页概览</b><span>探索手机的更多可能</span></header><div class="intro"><small>FIND YOUR PHONE</small><h3>${['找到适合你的手机。','好手机，选得更明白。','好选择，从了解开始。','探索你的下一部手机。','找到与你合拍的手机。','为性能而来。','选择，源于了解。','每一项参数，都有答案。','性能与细节，一目了然。','下一部手机，刚刚好。'][i]}</h3><p>查参数 · 看差异 · 选对手机</p></div><div class="searchbar">搜索品牌或型号 <b>搜索 →</b></div><div class="minihead"><b>探索热门机型</b><span>查看全部 →</span></div><div class="products">${['vivo X200','OPPO Find X8','HUAWEI Mate 70'].map((n,j)=>`<div class="product"><div class="pic">${['▯','▣','▤'][j]}</div><b>${n}</b><span>查看产品详情 →</span></div>`).join('')}</div></div></div><p class="detail">${d.desc}</p></section>`).join('');
